<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Tell the browser which character endcoding to use -->
    <meta charset="UTF-8">

    <!-- Set the title displayed on the browser tab -->
    <title>Animation Practice</title>

    <!-- Go up one folder, enter CSS folder, load the general styling -->
    <link rel="stylesheet" href="../CSS/style.css">
    <!-- Go up one folder, enter CSS folder, load animation-specific styling-->
    <link rel="stylesheet" href="../CSS/animations.css">
</head>

<body>
  <div class="dam-scene">

    <!-- Water held behind the dam -->
    <div class="reservoir">
        <p>RESERVOIR</p>
    </div>

    <!-- Main concrete dam structure -->
    <div class="dam-wall">

        <!-- Dark openning under the gate -->
        <div class="dam-opening"></div>

        <!-- Gate that will eventually move -->
        <div class="dam-gate"></div>
    </div>

    <!-- Area where water will flow out -->
    <div class="water-outlet">

        <!-- Individual water droplets -->
        <div class="droplet droplet-one"></div>
        <div class="droplet droplet-two"></div>
        <div class="droplet droplet-three"></div>
    </div> 

</body>

</html>
